
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question importante</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #ffeef3;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 700px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        #yes {
            background: #ff4d6d;
            color: white;
        }

        #no {
            background: #ddd;
            color: #222;
        }

        #message {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #ff4d6d;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            Ines, est-ce que tu t'engages à envoyer un nude à Koc tous les jours ? 😇
        </h1>

        <div class="buttons">
            <button id="yes">Oui ❤️</button>
            <button id="no">Non 😈</button>
        </div>

        <p id="message"></p>

    </div>

    <script>
        const yes = document.getElementById("yes");
        const no = document.getElementById("no");
        const message = document.getElementById("message");

        // OUI
        yes.addEventListener("click", function() {
            message.textContent = "🎉 Félicitations, merci !! ❤️";
        });

        // NON
        no.addEventListener("click", function() {

            no.style.position = "fixed";

            const maxX = window.innerWidth - no.offsetWidth - 20;
            const maxY = window.innerHeight - no.offsetHeight - 20;

            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);

            no.style.left = x + "px";
            no.style.top = y + "px";
        });
    </script>

</body>
</html>
